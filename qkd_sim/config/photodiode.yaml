# Optional theoretical IR data link (section 10). Off by default.
enabled: false

transmitter:
  wavelength_nm: 940                    # SPEC design doc
  optical_power_w: 0.5                  # SPEC
  full_angle_deg: 10.0                  # SPEC flat-top beam
  soft_edge_fraction: 0.10              # SPEC soft edge over the last 10% of the angle

receiver:
  lens_diameter_m: 0.025                # SPEC
  detector_size_m: 0.0027               # SPEC BPW34 class (2.7 mm square)
  focal_length_m: 0.025                 # ESTIMATE -> FOV ~ 2*atan(1.35/25) ~ 6.2 deg
  responsivity_apw: 0.6                 # SPEC
  transmission: 0.75                    # SPEC filter and lens
  pinhole:
    enabled: false                      # optional narrow FOV so a few mrad of pointing error drops S
    fov_full_angle_mrad: 6.0            # ESTIMATE
  mount_offset_m: [0.0, 0.06, 0.0]      # ESTIMATE beside the camera (camera frame: x forward, y left, z up)

frame_period_s: 0.001                   # SPEC 1 ms

background:                             # W of background optical power at the detector for each lighting scenario
  dark: 1.0e-8                          # ESTIMATE (940 nm filter passes little room light)
  office_50hz: 2.0e-7                   # ESTIMATE
  office_60hz: 2.0e-7                   # ESTIMATE
  bright_lamp: 3.0e-6                   # ESTIMATE incandescent-ish lamp is IR-rich
  window: 1.0e-5                        # ESTIMATE sunlight
  distractors: 2.0e-7                   # ESTIMATE
  flicker_follows_lighting: true

noise:
  bandwidth_hz: 50000.0                 # ESTIMATE amplifier bandwidth
  amplifier_current_noise_a_per_rthz: 2.0e-12   # ESTIMATE TIA input-referred
  electron_charge_c: 1.602176634e-19    # SPEC physical constant

test_link:
  bit_rate_bps: 10000.0                 # ESTIMATE OOK test pattern -> 10 bits per 1 ms frame
  threshold: midpoint                   # ESTIMATE ideal threshold between 0 and 1 levels

sanity:                                 # used by test A15 (+-30%)
  - {range_m: 5.0, expected_w: 3.0e-4}  # SPEC
  - {range_m: 20.0, expected_w: 2.0e-5} # SPEC
