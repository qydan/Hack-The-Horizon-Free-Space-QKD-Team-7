# World layout for qkd_lab (section 4). ENU, origin on the floor under the camera mount, +x toward the drone.
world_name: qkd_lab                     # gz world name used in every /world/<name>/... topic

bridge:
  # gz publishes the clock and all poses every physics step (1 kHz). Every message costs a Python callback
  # holding the GIL, so the bridges subscribe throttled. 250 Hz clock = 4 ms pacing resolution.
  clock_rate_hz: 250.0                  # ESTIMATE
  pose_rate_hz: 200.0                   # ESTIMATE

render:
  # Shadows OFF: Gazebo Harmonic 8.x (ogre2) segfaults in the wide-angle camera's shadow pass
  # (CompositorShadowNode::findNextEmptyShadowCastingLightEntry) when lights change at run time.
  shadows: false                        # ESTIMATE visual realism only; nothing measured depends on shadows

physics:
  max_step_size_s: 0.001                # SPEC (build spec section 4)
  real_time_factor: 1.0                 # SPEC target; lower is fine in lockstep
  engine: dartsim                       # SPEC

room:
  size_xyz_m: [8.0, 6.0, 3.0]           # SPEC (build spec)
  centre_xy_m: [2.5, 0.0]               # ESTIMATE room placed so camera and drone both sit well inside
  wall_rgb: [0.55, 0.55, 0.52]          # ESTIMATE matte wall albedo
  floor_texture: checker_noise.png      # generated by tools/build_assets.py (texture for vision-positioning realism)

camera_mount:
  position_m: [0.0, 0.0, 0.0]           # SPEC
  lens_height_m: 1.00                   # MEASURE lens-centre height on the real tripod

hover_station_m: [3.0, 0.0, 1.2]        # SPEC desk-demo range 3 m

fan:
  position_m: [3.0, -1.2, 1.2]          # SPEC
  axis: [0.0, 1.0, 0.0]                 # SPEC blowing +y (crosswind across the line of sight)

checkerboard:
  shown_position_m: [1.0, 0.0, 1.0]     # SPEC
  hidden_position_m: [-3.5, 2.8, -5.0]  # ESTIMATE off-scene parking spot (below the floor, behind the camera)

static_beacons_m:                       # T1 only
  - [1.0, 0.0, 1.0]                     # SPEC
  - [4.0, 0.0, 1.0]                     # SPEC

spherical_coordinates:                  # PX4 needs a home position for navsat; arbitrary but fixed
  latitude_deg: 47.397971               # ESTIMATE (PX4 default home)
  longitude_deg: 8.546164               # ESTIMATE
  elevation_m: 488.0                    # ESTIMATE

props:                                  # scenario props (all visual / kinematic)
  checkerboard:
    inner_corners: [9, 6]               # SPEC
    square_m: 0.040                     # SPEC
    margin_m: 0.02                      # ESTIMATE white border
    texture_px_per_square: 64           # ESTIMATE
  occluder:
    size_m: [0.10, 0.18]                # ESTIMATE hand-sized plate (width, height)
    default_duration_s: 0.6             # ESTIMATE sweep time
    default_sweep_m: 0.40               # ESTIMATE sweep length across the line of sight
  spinning_arm:                         # calib_rolling_shutter
    position_m: [3.0, 0.0, 1.0]         # ESTIMATE hub at the hover-station range
    arm_length_m: 0.30                  # ESTIMATE
    speed_rad_s: 12.566                 # ESTIMATE 2 rev/s -> 3.8 m/s tip speed
  slider_beacon:                        # test A7: beacon moving sideways at 1 m/s at 3 m
    position_m: [3.0, -1.5, 1.0]        # ESTIMATE start of travel
    speed_mps: 1.0                      # SPEC (A7)
    travel_m: 3.0                       # ESTIMATE
  stand:
    pole_diameter_m: 0.02               # ESTIMATE beacon tripod pole
  desk_fan_visual:
    base_diameter_m: 0.25               # ESTIMATE
    head_depth_m: 0.12                  # ESTIMATE
  tripod:
    leg_spread_m: 0.35                  # ESTIMATE visual only

floor_texture:
  tile_m: 0.10                          # ESTIMATE random checker tiles for "vision positioning" texture
  px_per_tile: 24                       # ESTIMATE

mission:                                # qkd_field.sdf (optional D3 roadmap world)
  world_name: qkd_field
  ground_size_m: 1000.0                 # ESTIMATE
  hover_station_m: [300.0, 0.0, 50.0]   # SPEC
  beacon_scale: 10.0                    # ESTIMATE 40 mm -> 0.4 m sphere so it spans ~1 px at 300 m (documented)

pendulum_world:
  world_name: qkd_pendulum
