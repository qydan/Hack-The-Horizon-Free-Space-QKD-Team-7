# Mount alignment: static beacons at known positions (1, 0, 1) and (4, 0, 1), one at a time.
test: calibration
description: Static beacons at known positions for camera-to-mount / camera-to-gimbal alignment.
world: qkd_lab
rigs: [rig_fixed, rig_gimbal]
payload: none
fidelity: full
seed: 802
duration_s: 60
drone: {enabled: false}
props: {static_beacons: true}
pose_tracks:
  static_beacon_near:
    - {t_s: 0,  xyz: [1.0, 0.0, 1.0]}
    - {t_s: 30, xyz: [1.0, 0.0, -20.0]}
  static_beacon_far:
    - {t_s: 0,  xyz: [4.0, 0.0, -20.0]}
    - {t_s: 30, xyz: [4.0, 0.0, 1.0]}
lighting: {initial: office_50hz}
